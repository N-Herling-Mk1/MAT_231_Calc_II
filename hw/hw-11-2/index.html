<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homework · MAT 231</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32.png">
  <link rel="icon" href="../../assets/img/favicon.ico" sizes="any">
  <link rel="stylesheet" href="../../assets/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="hw-top">
    <div class="row">
      <a class="home-btn" href="../../index.html" title="Back to the study hub"><span aria-hidden="true">⌂</span> Home</a>
      <h1 id="hw-title">Homework</h1>
      <span class="seg" id="mode" role="group" aria-label="View mode"></span>
      <button class="tbtn" id="btn-shots" type="button" title="Show or hide every original screenshot (they include the graded submissions)">Screenshots</button>
      <div class="spacer"></div>
      <a class="tbtn" id="deck-link" target="_blank" rel="noopener" hidden>Slides ↗</a>
      <a class="tbtn" id="quiz-link" hidden>Slide quiz →</a>
      <a class="tbtn" href="../../search.html" title="Search problems, quizzes and slides by keyword or tag">Search</a>
    </div>
  </header>
  <main class="hw-layout">
    <section>
      <div class="hw-intro" id="hw-intro"></div>
      <div id="probs"></div>
    </section>
    <aside class="hw-side" aria-label="Problem map">
      <h3>Problems</h3>
      <div class="pmap" id="pmap"></div>
      <div class="hw-prog" style="margin-top:10px"><span class="bar"><i class="ok" id="bar-ok"></i><i class="rv" id="bar-rv"></i></span></div>
      <div class="hw-prog"><span id="prog-text"></span></div>
      <div class="legend"><span><i style="background:var(--green-wash)"></i>got it</span><span><i style="background:var(--amber-wash)"></i>review</span></div>
      <div class="sidebtns">
        <button class="tbtn" id="btn-filter" type="button">Show Review only</button>
        <button class="tbtn" id="btn-reset" type="button">Reset marks</button>
      </div>
    </aside>
  </main>
  <script src="../../assets/vendor/katex/katex.min.js"></script>
  <script src="../../assets/vendor/katex/contrib/auto-render.min.js"></script>
  <script src="data.js"></script>
  <script src="../../assets/js/hw-engine.js"></script>
</body>
</html>
