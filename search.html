<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · MAT 231</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
  <link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <nav class="topnav" aria-label="Site">
    <div class="wrap topnav-row">
      <a class="home-btn" href="index.html"><span aria-hidden="true">⌂</span> Home</a>
      <span class="topnav-links"><a href="index.html#col-quizzes">Slide quizzes</a><a href="index.html#col-slides">Slides</a><a href="index.html#col-hw">Homework</a><a href="index.html#col-review">Review</a></span>
    </div>
  </nav>
  <main class="wrap">
    <section class="search-hero">
      <h1>Search</h1>
      <form class="searchbox" id="form" role="search">
        <label class="sr-only" for="q">Keywords</label>
        <input id="q" type="search" placeholder="keywords — e.g. telescoping, ratio test, ln n, interval of convergence" autocomplete="off" autofocus>
        <button type="submit">Search</button>
      </form>
      <div class="filters" id="types"><span class="lbl">Show</span></div>
      <div class="filters"><span class="lbl">Section</span><span id="secs" style="display:contents"></span></div>
      <div class="filters"><span class="lbl">Tags</span><span class="lbl" style="text-transform:none" id="taghint">click to filter (several tags = all of them)</span></div>
      <div class="tagcloud" id="tags"></div>
    </section>
    <p class="status-line" id="status">Loading the index…</p>
    <section class="results" id="results" aria-live="polite"></section>
  </main>

  <script src="assets/vendor/katex/katex.min.js"></script>
  <script src="assets/vendor/katex/contrib/auto-render.min.js"></script>
  <script src="assets/js/slides.js"></script>
  <script src="assets/js/slide-text.js"></script>
  <script src="assets/js/manifest.js"></script>
  <script>
  /* Search over four kinds of item, all built in the browser (works from file:// — no fetch):
       hw    — one per homework problem   (hw/<set>/data.js, loaded with <script> tags)
       quiz  — one per quiz question      (quizzes/<quiz>/data.js)
       deck  — one per PDF                (assets/js/slides.js: hand tags)
       slide — one per PDF page           (assets/js/slide-text.js: extracted text)
     Keywords must all appear (title, text or tags). Tags are the hand-added labels; a tag filter
     keeps only items carrying every selected tag. URL: search.html?q=…&tag=a,b&type=hw&sec=11.3 */
  (function () {
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const TYPES = [["all", "All"], ["hw", "Homework"], ["quiz", "Quiz questions"], ["deck", "Slide decks"], ["slide", "Slide pages"]];
    const params = new URLSearchParams(location.search);
    const st = { q: params.get("q") || "", tags: (params.get("tag") || "").split(",").filter(Boolean), type: params.get("type") || "all", sec: params.get("sec") || "all" };
    const items = [];

    // ---- LaTeX → searchable plain text (keeps words like "ln", "sin", "sum"; drops markup)
    const plain = (s) => String(s || "")
      .replace(/<[^>]+>/g, " ")
      .replace(/\\(?:dfrac|tfrac|frac)\s*/g, " ").replace(/\\(?:displaystyle|left|right|big|Big|quad|qquad|,|;|!|mathrm|text|operatorname|underline)\b/g, " ")
      .replace(/\\(sum|int|lim|ln|log|sin|cos|tan|arctan|sqrt|infty|pi|cdots|ldots|le|ge|ne|to|alpha|theta)\b/g, " $1 ")
      .replace(/[{}$^_\\]/g, " ").replace(/&[a-z]+;/g, " ").replace(/\s+/g, " ").trim();
    const norm = (s) => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[’']/g, "").replace(/-/g, " ");

    // ---- index the decks and their pages
    const SL = window.SLIDE_DECKS || [], TXT = window.SLIDE_TEXT || {};
    SL.forEach((d) => {
      items.push({ type: "deck", sec: d.sec, title: `${d.sec} slides — ${d.title}`, href: `slides/viewer.html?d=${d.key}`, tags: d.tags, text: `${d.title} ${d.kind}` });
      const add = (file, ans) => (TXT[file] || []).forEach((t, i) => items.push({
        type: "slide", sec: d.sec, title: `${d.sec} ${d.title}${ans ? " (answers)" : ""} · page ${i + 1}`,
        href: `slides/viewer.html?d=${d.key}${ans ? "&v=ans" : ""}#page=${i + 1}`, tags: [], text: t.replace(/ \/ /g, " · ") }));
      add(d.file, false); if (d.ans) add(d.ans, true);
    });

    // ---- load every homework set and quiz (sequential <script> loads; each sets window.HW / window.QUIZ)
    const M = window.MANIFEST || { hw: [], quizzes: [] };
    const queue = [...M.hw.map((h) => ["hw", h]), ...M.quizzes.map((q) => ["quiz", q])];
    function loadNext() {
      if (!queue.length) return ready();
      const [kind, m] = queue.shift();
      window.HW = window.QUIZ = undefined;
      const s = document.createElement("script");
      s.src = m.data;
      s.onload = () => {
        if (kind === "hw" && window.HW) window.HW.problems.forEach((p) => items.push({
          type: "hw", sec: m.sec, title: `HW ${m.sec} · Problem ${p.n}`, sub: m.title, href: `${m.href}#p${p.n}`, tags: p.tags || [],
          text: plain([p.prompt, ...(p.parts || []).map((x) => `${x.q || ""} ${(x.opts || []).join(" ")}`), ...(p.opts || [])].join(" ")) }));
        if (kind === "quiz" && window.QUIZ) window.QUIZ.questions.forEach((q) => items.push({
          type: "quiz", sec: m.sec, title: `${m.title} · Q${q.n}`, sub: q.src || "", href: `${m.href}#q${q.n}`, tags: q.tags || [],
          text: plain([q.prompt, q.prompt2, ...(q.options || []).map((o) => o.text), ...(q.items || []).map((i) => i.label)].join(" ")) }));
        loadNext();
      };
      s.onerror = loadNext;
      document.body.appendChild(s);
    }

    // ---- UI
    function ready() {
      items.forEach((it) => { it._hay = norm(`${it.title} ${it.sub || ""} ${it.text} ${it.tags.join(" ")}`); it._tags = new Set(it.tags); });
      TYPES.forEach(([k, label]) => { const b = document.createElement("button"); b.type = "button"; b.className = "fbtn"; b.dataset.k = k; b.innerHTML = `${label}<span class="n"></span>`; b.onclick = () => { st.type = k; update(); }; $("#types").appendChild(b); });
      const secs = ["all", ...[...new Set(items.map((i) => i.sec))].sort((a, b) => { const f = (s) => /^\d/.test(s) ? Number(s.split(".")[1]) : 100; return f(a) - f(b); })];
      secs.forEach((s) => { const b = document.createElement("button"); b.type = "button"; b.className = "fbtn"; b.dataset.s = s; b.textContent = s === "all" ? "All" : s; b.onclick = () => { st.sec = s; update(); }; $("#secs").appendChild(b); });
      $("#q").value = st.q;
      $("#form").addEventListener("submit", (e) => { e.preventDefault(); st.q = $("#q").value; update(); });
      let t; $("#q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { st.q = $("#q").value; update(); }, 160); });
      update();
    }

    function match(it, words) {
      if (st.sec !== "all" && it.sec !== st.sec) return false;
      if (!st.tags.every((t) => it._tags.has(t))) return false;
      return words.every((w) => w.startsWith("#") ? it._tags.has(w.slice(1)) : it._hay.includes(w));
    }
    function score(it, words) {
      let s = { hw: 4, quiz: 3, deck: 5, slide: 1 }[it.type];
      words.forEach((w) => { if (it._tags.has(w.replace(/^#/, "").replace(/ /g, "-"))) s += 6; if (norm(it.title).includes(w)) s += 3; s += Math.min(4, it._hay.split(w).length - 1); });
      return s;
    }
    function snippet(it, words) {
      const t = it.text; if (!t) return "";
      const low = norm(t); let at = -1;
      for (const w of words) { const k = low.indexOf(w); if (k >= 0 && (at < 0 || k < at)) at = k; }
      let a = Math.max(0, at - 70), s = t.slice(a, a + 260);
      s = esc((a ? "…" : "") + s + (a + 260 < t.length ? "…" : ""));
      words.filter((w) => !w.startsWith("#") && w.length > 1).forEach((w) => { s = s.replace(new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig"), "<mark>$1</mark>"); });
      return s;
    }

    function update() {
      // phrase in quotes stays together; otherwise split on spaces; #tag words filter by tag
      const words = (st.q.match(/"[^"]+"|\S+/g) || []).map((w) => w.startsWith("#") ? "#" + w.slice(1).toLowerCase() : norm(w.replace(/"/g, "")));
      const qs = new URLSearchParams(); if (st.q) qs.set("q", st.q); if (st.tags.length) qs.set("tag", st.tags.join(",")); if (st.type !== "all") qs.set("type", st.type); if (st.sec !== "all") qs.set("sec", st.sec);
      history.replaceState(null, "", "search.html" + (qs.toString() ? "?" + qs : ""));
      const base = items.filter((it) => match(it, words));
      const counts = { all: base.length }; base.forEach((it) => (counts[it.type] = (counts[it.type] || 0) + 1));
      document.querySelectorAll("#types .fbtn").forEach((b) => { b.classList.toggle("on", b.dataset.k === st.type); b.querySelector(".n").textContent = counts[b.dataset.k] || 0; });
      document.querySelectorAll("#secs .fbtn").forEach((b) => b.classList.toggle("on", b.dataset.s === st.sec));
      const hits = base.filter((it) => st.type === "all" || it.type === st.type);
      // tag cloud: counts among the current hits (plus any selected tags)
      const tc = {}; (words.length || st.tags.length || st.sec !== "all" ? hits : items).forEach((it) => it.tags.forEach((t) => (tc[t] = (tc[t] || 0) + 1)));
      st.tags.forEach((t) => (tc[t] = tc[t] || 0));
      $("#tags").innerHTML = Object.keys(tc).sort((a, b) => (st.tags.includes(b) - st.tags.includes(a)) || tc[b] - tc[a] || a.localeCompare(b))
        .map((t) => `<button type="button" class="${st.tags.includes(t) ? "on" : ""}" data-t="${esc(t)}">#${esc(t)}<span class="n">${tc[t]}</span></button>`).join("");
      $("#tags").querySelectorAll("button").forEach((b) => b.onclick = () => { const t = b.dataset.t; st.tags = st.tags.includes(t) ? st.tags.filter((x) => x !== t) : [...st.tags, t]; update(); });
      if (!words.length && !st.tags.length && st.sec === "all") { $("#status").textContent = `${items.length} items indexed (${counts.hw || 0} homework problems, ${counts.quiz || 0} quiz questions, ${counts.deck || 0} PDFs, ${counts.slide || 0} slide pages). Type keywords or pick a tag.`; $("#results").innerHTML = ""; return; }
      hits.sort((a, b) => score(b, words) - score(a, words));
      $("#status").textContent = `${hits.length} result${hits.length === 1 ? "" : "s"}${st.tags.length ? ` · tags: ${st.tags.map((t) => "#" + t).join(" ")}` : ""}${hits.length > 200 ? " · showing the first 200" : ""}`;
      const kind = { hw: "Homework", quiz: "Quiz question", deck: "Slide deck", slide: "Slide page" };
      $("#results").innerHTML = hits.slice(0, 200).map((it) => `<article class="hit t-${it.type}"><span class="kind">${kind[it.type]}${it.sub ? ` · ${esc(it.sub)}` : ""}</span>
        <a class="ttl" href="${it.href}">${esc(it.title)}</a><div class="snip">${snippet(it, words.filter((w) => !w.startsWith("#")))}</div>
        ${it.tags.length ? `<div class="tags">${it.tags.map((t) => `<a class="tag" href="search.html?tag=${encodeURIComponent(t)}">#${esc(t)}</a>`).join("")}</div>` : ""}</article>`).join("");
    }

    loadNext();
  })();
  </script>
</body>
</html>
