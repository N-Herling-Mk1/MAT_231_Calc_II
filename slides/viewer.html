<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecture slides · MAT 231</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="icon" href="../assets/img/favicon.ico" sizes="any">
  <link rel="stylesheet" href="../assets/css/quiz.css">
  <style>
    /* Slide viewer: the quiz pages' top bar; the PDF (shown as is) fills the rest of the window.
       viewer.html?d=11-8&v=ans#page=4 opens deck 11-8, answers version, at page 4. */
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    .topbar { flex-wrap: nowrap; position: relative; }
    .topbar h1 { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; min-width: 80px; }
    .topbar .spacer { display: none; }
    .topbar .deckpick { display: flex; align-items: center; gap: 6px; }
    .topbar select { font: inherit; font-size: 14px; padding: 7px 8px; border: 1px solid #b9d3dc; background: #fff; max-width: 340px; }
    .topbar .meta { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
    .vseg { display: inline-flex; border: 1px solid var(--cyan); }
    .vseg button { border: 0; background: #fff; color: var(--cyan-ink); padding: 6px 12px; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .vseg button + button { border-left: 1px solid #bfe7f0; }
    .vseg button.on { background: var(--cyan-ink); color: #fff; }
    .viewer { flex: 1; min-height: 0; display: flex; background: #e9f1f4; }
    .viewer iframe { flex: 1; width: 100%; height: 100%; border: 0; display: block; }
    .nopdf { margin: auto; max-width: 520px; background: #fff; border: 1px solid var(--line); padding: 24px 26px; text-align: center; }
    .nopdf p { margin: 0 0 16px; color: var(--ink-2); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (max-width: 1000px) { .topbar { flex-wrap: wrap; } .topbar h1 { flex-basis: 100%; order: 5; font-size: 14px; white-space: normal; } .topbar .meta { display: none; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="home-btn" href="../index.html" title="Back to the study hub"><span aria-hidden="true">⌂</span> Home</a>
    <div class="deckpick">
      <button class="btn small" id="btn-prev" type="button" title="Previous deck" aria-label="Previous deck">◀</button>
      <label class="sr-only" for="deck-pick">Slide deck</label>
      <select id="deck-pick"></select>
      <button class="btn small" id="btn-next" type="button" title="Next deck" aria-label="Next deck">▶</button>
    </div>
    <span class="vseg" id="vseg" hidden><button type="button" data-v="blank" title="The slides as handed out (blank work space)">Blank</button><button type="button" data-v="ans" title="The version with answers filled in">Answers</button></span>
    <h1 id="deck-title">Lecture slides</h1>
    <span class="meta" id="deck-meta"></span>
    <a class="btn" id="btn-quiz" hidden>Slide quiz →</a>
    <a class="btn" id="btn-hw" hidden>Homework →</a>
    <a class="btn" href="../search.html" title="Search slides, quizzes and homework">Search</a>
    <a class="btn primary" id="btn-pdf" target="_blank" rel="noopener">Open PDF ↗</a>
  </header>

  <main class="viewer">
    <iframe id="frame" title="Lecture slides (PDF)"></iframe>
    <div class="nopdf" id="nopdf" hidden>
      <p>This browser can't show PDFs inside the page. Open the PDF on its own.</p>
      <a class="btn primary" id="alt-pdf" target="_blank" rel="noopener">Open PDF ↗</a>
    </div>
  </main>

  <script src="../assets/js/slides.js"></script>
  <script>
    const decks = window.SLIDE_DECKS || [];
    const qs = new URLSearchParams(location.search);
    let i = Math.max(0, decks.findIndex((d) => d.key === qs.get("d")));
    const d = decks[i];
    const $ = (id) => document.getElementById(id);
    const page = (location.hash.match(/page=(\d+)/) || [])[1];

    const pick = $("deck-pick");
    decks.forEach((x, k) => pick.add(new Option(`${x.sec} · ${x.title}`, x.key, false, k === i)));
    const go = (k) => { if (k >= 0 && k < decks.length) location.href = "viewer.html?d=" + decks[k].key; };
    pick.addEventListener("change", () => go(pick.selectedIndex));
    $("btn-prev").addEventListener("click", () => go(i - 1));
    $("btn-next").addEventListener("click", () => go(i + 1));
    $("btn-prev").disabled = i === 0;
    $("btn-next").disabled = i === decks.length - 1;

    if (d) {
      const v = d.ans && qs.get("v") === "ans" ? "ans" : "blank";
      const file = v === "ans" ? d.ans : d.file;
      const pdf = `decks/${file}.pdf`;
      document.title = `${d.sec} — ${d.title}${v === "ans" ? " (answers)" : ""} · MAT 231`;
      $("deck-title").textContent = `${d.sec} — ${d.title}`;
      $("deck-meta").textContent = `${v === "ans" ? d.ansPages : d.pages} pages${page ? ` · p. ${page}` : ""}`;
      $("btn-pdf").href = $("alt-pdf").href = pdf + (page ? "#page=" + page : "");
      if (d.ans) {
        $("vseg").hidden = false;
        [...$("vseg").children].forEach((b) => {
          b.classList.toggle("on", b.dataset.v === v);
          b.addEventListener("click", () => { location.href = `viewer.html?d=${d.key}${b.dataset.v === "ans" ? "&v=ans" : ""}`; });
        });
      }
      if (d.quiz) { const q = $("btn-quiz"); q.href = "../" + d.quiz; q.hidden = false; }
      if (d.hw) { const h = $("btn-hw"); h.href = "../" + d.hw; h.hidden = false; }
      if (navigator.pdfViewerEnabled === false) {
        $("frame").remove(); $("nopdf").hidden = false;
      } else {
        $("frame").src = pdf + (page ? `#page=${page}&view=FitH` : "#view=FitH");
      }
    }
    document.addEventListener("keydown", (e) => {
      if (e.target.closest("select, input")) return;
      if (e.key === "[") go(i - 1);
      if (e.key === "]") go(i + 1);
    });
  </script>
</body>
</html>
